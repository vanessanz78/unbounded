<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 250" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Unbordered premium gold logo</title>
  <desc id="desc">Transparent-background gold Unbordered wordmark with koru and fern detail inside the O, plus optional Family descriptor.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.18" stop-color="#d9a846"/>
      <stop offset="0.44" stop-color="#f6d06c"/>
      <stop offset="0.68" stop-color="#a96e1f"/>
      <stop offset="1" stop-color="#f8d978"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.5" stop-color="#d7a84f"/>
      <stop offset="1" stop-color="#8d5b1c"/>
    </linearGradient>
    <filter id="foil" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#000" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="0" stdDeviation=".8" flood-color="#fff0a6" flood-opacity=".35"/>
    </filter>
    <style>
      .word {
        font-family: "Cinzel", "Cormorant Garamond", Georgia, serif;
        font-weight: 500;
        letter-spacing: .035em;
      }
      .family {
        font-family: Inter, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: .55em;
      }
    </style>
  </defs>

  <g filter="url(#foil)">
    <text x="22" y="118" fill="url(#gold)" class="word" font-size="94">UNB</text>
    <text x="474" y="118" fill="url(#gold)" class="word" font-size="94">RDERED</text>

    <g transform="translate(311 28)">
      <path d="M89.5 12C46 13.8 11.4 50.3 12.7 93.9c1.4 46.5 40.5 81.4 86.2 77.4 34.4-3 60.9-27.1 70.1-58.4" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
      <path d="M155.8 24.5c15.5 20.7 21.4 47.2 15.8 72.5" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity=".9"/>
      <path d="M94.7 126.2c-23.6 2.4-43.9-14.5-46.4-37.9C45.9 65.1 62.1 45 84.7 42.4c22.3-2.6 41.3 13.1 43.8 35 2 17.8-10.5 33.7-27.9 35.8-12.7 1.5-23.8-7.4-25.1-20-1-9.4 5.5-17.7 14.6-18.7 6.4-.8 12.2 3.8 13 10.1" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
      <path d="M96 137c30-38 58.4-68.2 85.4-90.7" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <path d="M126 107c12.5 1.2 24.8-.3 36.8-4.6-9.2 9.6-19.8 15.3-31.7 17.3" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M135 94c12.8-.4 24.3-4.3 34.5-11.7-6.2 11.1-15 19.1-26.3 23.9" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M147 81c10.9-2.9 20.2-8.9 27.7-18-3.1 11.7-9.3 21.2-18.6 28.5" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M158 68c8.3-4.3 14.8-10.8 19.4-19.4-.5 10-4.2 18.7-11.2 26.2" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M110 121c6.5 8.2 15.1 14.1 25.8 17.7-11.5 1.7-21.8-.2-30.8-5.6" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M122 111c6.7 6.2 14.8 10.4 24.4 12.4-9.8 3.1-18.9 2.8-27.4-.9" stroke="url(#goldSoft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(386 170)">
      <line x1="-76" y1="11" x2="-18" y2="11" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="20" fill="url(#gold)" class="family" font-size="24">FAMILY</text>
      <line x1="154" y1="11" x2="212" y2="11" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
